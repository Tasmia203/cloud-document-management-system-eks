apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloud-file-manager

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cloud-file-manager

  template:
    metadata:
      labels:
        app: cloud-file-manager

    spec:
      containers:
        - name: cloud-file-manager
          image: 544015793973.dkr.ecr.us-east-1.amazonaws.com/cloud-file-manager:latest

          ports:
            - containerPort: 5000

          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-secret
                  key: AWS_ACCESS_KEY_ID

            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-secret
                  key: AWS_SECRET_ACCESS_KEY

            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: aws-secret
                  key: AWS_DEFAULT_REGION