apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloud-file-manager

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cloud-file-manager

  template:
    metadata:
      labels:
        app: cloud-file-manager

    spec:
      containers:
        - name: cloud-file-manager
          image: 544015793973.dkr.ecr.us-east-1.amazonaws.com/cloud-file-manager:IMAGE_TAG

          ports:
            - containerPort: 5000
          
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
            

          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-secret
                  key: AWS_ACCESS_KEY_ID

            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-secret
                  key: AWS_SECRET_ACCESS_KEY

            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: cloud-file-manager-config
                  key: AWS_DEFAULT_REGION
            
            - name: BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: cloud-file-manager-config
                  key: BUCKET_NAME